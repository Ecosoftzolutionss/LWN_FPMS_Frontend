name: Deploy FPMS Frontend

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW RUNNER INFORMATION
      # ============================================================
      - name: Show runner information
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       FPMS FRONTEND DEPLOYMENT STARTED"
          Write-Host "=============================================="

          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "User     : $env:USERNAME"
          Write-Host "Runner   : $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Temp     : $env:RUNNER_TEMP"

          Write-Host "=============================================="


      # ============================================================
      # 3. SETUP NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'


      # ============================================================
      # 4. CHECK NODE AND NPM
      # ============================================================
      - name: Check Node.js and npm
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       CHECKING NODE.JS"
          Write-Host "=============================================="

          node --version
          npm --version

          if ($LASTEXITCODE -ne 0) {
              throw "Node.js or npm is not available."
          }

          Write-Host "Node.js is available."


      # ============================================================
      # 5. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       INSTALLING NPM DEPENDENCIES"
          Write-Host "=============================================="

          npm ci

          if ($LASTEXITCODE -ne 0) {
              throw "npm ci failed."
          }

          Write-Host "Dependencies installed successfully."


      # ============================================================
      # 6. BUILD REACT APPLICATION
      # ============================================================
      - name: Build React application
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       BUILDING FPMS FRONTEND"
          Write-Host "=============================================="

          npm run build

          if ($LASTEXITCODE -ne 0) {
              throw "React build failed."
          }

          Write-Host "React build completed successfully."


      # ============================================================
      # 7. CHECK BUILD FOLDER
      # ============================================================
      - name: Verify build
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       VERIFYING BUILD"
          Write-Host "=============================================="

          $buildPath = Join-Path $env:GITHUB_WORKSPACE "build"

          Write-Host "Build path:"
          Write-Host $buildPath

          if (!(Test-Path $buildPath)) {
              throw "Build folder was not created: $buildPath"
          }

          if (!(Test-Path "$buildPath\index.html")) {
              throw "index.html was not found inside build folder."
          }

          Write-Host "Build folder found."
          Write-Host "index.html found."

          Write-Host "Build verification successful."


      # ============================================================
      # 8. BACKUP EXISTING FRONTEND
      # ============================================================
      - name: Backup Existing Frontend
        shell: powershell
        run: |

          # ========================================================
          # LIVE FRONTEND PATH
          # ========================================================
          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\Frontend\build"


          # ========================================================
          # BACKUP ROOT
          # ========================================================
          $backupRoot = "D:\EZ Hosting\FPMS_LWN\Backups\Frontend"


          # ========================================================
          # TIMESTAMP
          # ========================================================
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"

          $backupPath = Join-Path $backupRoot $timestamp


          Write-Host "=============================================="
          Write-Host "       CREATING FRONTEND BACKUP"
          Write-Host "=============================================="

          Write-Host "Live Frontend:"
          Write-Host $livePath

          Write-Host "Backup Root:"
          Write-Host $backupRoot

          Write-Host "Backup Path:"
          Write-Host $backupPath


          # ========================================================
          # CHECK LIVE FRONTEND
          # ========================================================
          if (!(Test-Path $livePath)) {

              Write-Host "Live frontend does not exist."
              Write-Host "Backup will be skipped."

              exit 0
          }


          # ========================================================
          # CREATE BACKUP ROOT
          # ========================================================
          if (!(Test-Path $backupRoot)) {

              Write-Host "Backup root does not exist."
              Write-Host "Creating backup root..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $backupRoot | Out-Null
          }


          # ========================================================
          # CREATE TIMESTAMP BACKUP
          # ========================================================
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $backupPath | Out-Null


          # ========================================================
          # COPY CURRENT FRONTEND
          # ========================================================
          Write-Host "Starting frontend backup..."

          robocopy `
            $livePath `
            $backupPath `
            /E `
            /R:2 `
            /W:2


          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy backup exit code: $robocopyExitCode"


          # ========================================================
          # ROBOCOPY:
          # 0-7 = SUCCESS
          # 8+  = FAILURE
          # ========================================================
          if ($robocopyExitCode -ge 8) {

              throw "Frontend backup failed. Robocopy exit code: $robocopyExitCode"
          }


          # IMPORTANT
          # Prevent Robocopy 1-7 from failing GitHub Actions
          $global:LASTEXITCODE = 0


          Write-Host "=============================================="
          Write-Host "       FRONTEND BACKUP SUCCESSFUL"
          Write-Host "=============================================="

          Write-Host "Backup location:"
          Write-Host $backupPath


      # ============================================================
      # 9. DEPLOY FRONTEND
      # ============================================================
      - name: Deploy Frontend
        shell: powershell
        run: |

          # ========================================================
          # SOURCE BUILD
          # ========================================================
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "build"


          # ========================================================
          # LIVE FRONTEND
          # ========================================================
          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\Frontend\build"


          Write-Host "=============================================="
          Write-Host "       DEPLOYING FPMS FRONTEND"
          Write-Host "=============================================="

          Write-Host "Source:"
          Write-Host $sourcePath

          Write-Host "Destination:"
          Write-Host $livePath


          # ========================================================
          # CHECK SOURCE
          # ========================================================
          if (!(Test-Path $sourcePath)) {

              throw "Build folder does not exist: $sourcePath"
          }


          if (!(Test-Path "$sourcePath\index.html")) {

              throw "index.html was not found in build folder."
          }


          # ========================================================
          # CREATE LIVE DIRECTORY IF REQUIRED
          # ========================================================
          if (!(Test-Path $livePath)) {

              Write-Host "Live frontend folder does not exist."
              Write-Host "Creating folder..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $livePath | Out-Null
          }


          # ========================================================
          # DEPLOY USING ROBOCOPY
          # ========================================================
          Write-Host "Starting frontend deployment..."

          robocopy `
            $sourcePath `
            $livePath `
            /MIR `
            /R:2 `
            /W:2


          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy deployment exit code: $robocopyExitCode"


          # ========================================================
          # ROBOCOPY:
          # 0-7 = SUCCESS
          # 8+  = FAILURE
          # ========================================================
          if ($robocopyExitCode -ge 8) {

              throw "Frontend deployment failed. Robocopy exit code: $robocopyExitCode"
          }


          # IMPORTANT
          # Reset Robocopy exit code
          $global:LASTEXITCODE = 0


          Write-Host "=============================================="
          Write-Host "       FRONTEND DEPLOYMENT SUCCESSFUL"
          Write-Host "=============================================="


      # ============================================================
      # 10. VERIFY LIVE FRONTEND
      # ============================================================
      - name: Verify Frontend Deployment
        shell: powershell
        run: |

          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\Frontend\build"


          Write-Host "=============================================="
          Write-Host "       VERIFYING FRONTEND DEPLOYMENT"
          Write-Host "=============================================="


          Write-Host "Live path:"
          Write-Host $livePath


          # ========================================================
          # CHECK BUILD DIRECTORY
          # ========================================================
          if (!(Test-Path $livePath)) {

              throw "Live frontend build folder does not exist."
          }


          # ========================================================
          # CHECK INDEX.HTML
          # ========================================================
          if (!(Test-Path "$livePath\index.html")) {

              throw "index.html was not found after deployment."
          }


          # ========================================================
          # CHECK ASSETS
          # ========================================================
          if (!(Test-Path "$livePath\assets")) {

              Write-Host "WARNING: assets folder was not found."
          }
          else {

              Write-Host "assets folder found."
          }


          # ========================================================
          # DISPLAY FILE INFORMATION
          # ========================================================
          $indexFile = Get-Item "$livePath\index.html"


          Write-Host "index.html found."
          Write-Host "File size: $($indexFile.Length) bytes"
          Write-Host "Last modified: $($indexFile.LastWriteTime)"


          Write-Host "=============================================="
          Write-Host "       FRONTEND VERIFIED SUCCESSFULLY"
          Write-Host "=============================================="


      # ============================================================
      # 11. DEPLOYMENT COMPLETED
      # ============================================================
      - name: Deployment completed
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "================================================"
          Write-Host "       FPMS FRONTEND DEPLOYMENT SUCCESSFUL"
          Write-Host "================================================"

          Write-Host ""
          Write-Host "Server:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Frontend Live Path:"
          Write-Host "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\Frontend\build"

          Write-Host ""
          Write-Host "Frontend Backup Path:"
          Write-Host "D:\EZ Hosting\FPMS_LWN\Backups\Frontend"

          Write-Host ""
          Write-Host "Deployment Time:"
          Write-Host $(Get-Date)

          Write-Host ""
          Write-Host "================================================"
